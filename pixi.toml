[workspace]
authors = ["duongvu2005 <duongvu.nh05@gmail.com>"]
channels = ["conda-forge"]
name = "hpc-in-julia"
platforms = ["win-64", "osx-arm64"]
version = "0.1.0"

[tasks]
repl = "julia --project=. --threads=auto"
setup = "julia --project=. -e 'using Pkg; Pkg.instantiate()'"

[dependencies]
python = ">=3.14.7,<3.15"
gcc = ">=16.2.0,<16.3"
